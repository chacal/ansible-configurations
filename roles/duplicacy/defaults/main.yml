---
duplicacy_version: "3.2.5"
# sha256 of the release binaries. Update together with duplicacy_version. With a checksum
# get_url skips the download when the installed binary already matches.
duplicacy_checksums:
  x64: "548526d462fb38c23f2bf62ea3b1177b8ad11cc1499fa3dbe092a607d68d84f5"
  arm: "34ba5c2953c3b3fb9ea383b014f286c7b646b2ea95e6d75d0da22e9b8ca4f919"
duplicacy_backup_id: "{{ inventory_hostname | replace('.','-') }}"
duplicacy_repository: "/"
duplicacy_storage: "b2://chacal-backups/{{ inventory_hostname }}"
duplicacy_filters: ""
duplicacy_backup_hours: "*/12"
duplicacy_backup_minutes: "0"
duplicacy_prune_hours: "*/12"
duplicacy_prune_minutes: "45"
duplicacy_threads: 16
# Soft heap limit for the Go runtime. Without it the heap grows to ~2x the live data
# between GCs (571 MB RSS for a 450 MB incremental backup with 8 threads). Too low a
# limit makes the GC run continuously and slows the backup down instead of failing it.
duplicacy_gomemlimit: "384MiB"
# Log Go memory stats every second, for tuning the two settings above
duplicacy_print_memory_usage: false

# These must be in order from least frequently kept to most frequently kept
# Defaults mean:
# - All backups for last two weeks
# - Dailies: 2 weeks -> 1 month for backups between 2 weeks and one month
# - Weeklies: 1 month -> 3 months
# - Monthlies: 3 months -> 1 year
# - No backups: older than 1 year
duplicacy_prune_retentions:
  - "0:365"
  - "30:90"
  - "7:30"
  - "1:14"